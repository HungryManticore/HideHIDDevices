; HideHIDDevices.ini
;
; EnableLog=1 writes HideHIDDevices.log (and keeps the previous run's log as
; HideHIDDevices.prev.log) with the devices seen, what was hidden and crash
; details. Set it to 0 to turn logging and its diagnostic checks off.
EnableLog=1
;
; HideNonGameControllers=1 also hides (from the game only) every HID device
; that is not a game controller: extra HID mice/keyboards, RGB/lighting
; controllers, coolers, media keys, vendor-defined devices. The game still
; gets the mouse and keyboard through Windows' combined "Mouse" and
; "Keyboard" devices. Off (0) by default.
HideNonGameControllers=0

; Devices to hide from both the game and DirectInput itself, one per line, using a Hardware ID from Device Manager
; (device > Properties > Details > "Hardware Ids").
; Lines starting with ; or # are comments.
;
; HID\VID_xxxx&PID_yyyy                -> hides every device with that VID/PID
; HID\VID_xxxx&PID_yyyy&REV_zzzz       -> hides it only if a connected device
;                                         has exactly this ID (REV/MI/Col must match)

HID\VID_26CE&PID_01A2&REV_0000
