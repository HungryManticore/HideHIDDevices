; HideHIDDevices.ini
;
; HideNonGameControllers=1 hides every HID device that is not a game
; controller (extra HID mice/keyboards, RGB/lighting controllers, coolers,
; media keys, vendor-defined devices). The game still gets the mouse and
; keyboard through Windows' combined "Mouse" and "Keyboard" devices.
; Set it to 0 to hide only the devices listed below.
HideNonGameControllers=1

; Devices to hide, one per line, using a Hardware ID from Device Manager
; (device > Properties > Details > "Hardware Ids").
; Lines starting with ; or # are comments.
;
; HID\VID_xxxx&PID_yyyy                -> hides every device with that VID/PID
; HID\VID_xxxx&PID_yyyy&REV_zzzz       -> hides it only if a connected device
;                                         has exactly this ID (REV/MI/Col must match)

HID\VID_26CE&PID_01A2&REV_0000
